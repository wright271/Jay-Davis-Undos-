<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Undo's Family Restaurant Amateur Golf Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
:root{
  --ink:#0c3a1d;        /* Undo's deep green — header ground */
  --gold:#F2D64B;       /* the yellow ring on the Undo's mark */
  --board:#14512b;
  --board-alt:#185c31;
  --board-hd:#0c3a1d;
  --dim:#7fa48b;
  --mid:#aecfb9;
  --up:#9ae8ac;
  --dn:#ff9fae;
  --brand:#14512b;
  --green:#1b7a33;
  --green-bg:#e6f4e9;
  --over:#c41e3a;
  --over-bg:#fdeaee;
  --cream:#fbf7e6;
  --bg:#eef2ee;
  --card:#ffffff;
  --border:#d7ded9;
  --text:#1c2733;
  --muted:#5d6b7c;
  --faint:#94a1b2;
  --board-line:rgba(255,255,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}

/* ===== Header ===== */
.hdr{background:var(--ink)}
.hdr-rule{height:3px;background:var(--gold)}
.hdr-brand{display:flex;align-items:center;justify-content:center;gap:13px;padding:14px 14px 12px}
.hdr-txt{min-width:0;text-align:center}
.hdr-title{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:21px;color:var(--gold);line-height:1.2;letter-spacing:.2px}
.hdr-sub{font-size:9px;color:#b7cdbd;letter-spacing:1px;text-transform:uppercase;margin-top:5px;line-height:1.35}

/* Sponsor strip — white ground, since the marks are drawn for white */
.sponsors{background:#fff;border-top:3px solid var(--gold);display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 10px;flex-wrap:nowrap}
.sp{display:flex;align-items:center;justify-content:center;min-width:0}
.sp img{display:block;width:auto;max-width:100%;object-fit:contain}
.sp-main{flex:0 1 auto;max-width:40%}
.sp-main img{max-height:50px}
.sp-side{flex:0 1 auto;max-width:28%}
.sp-side img{max-height:20px}
@media(max-width:380px){.sp-main img{max-height:40px}.sp-side img{max-height:17px}.sponsors{gap:10px}}
.hdr-lead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--board)}
.hdr-lead.none{justify-content:center;text-align:center;padding:12px 14px}
.hl-cap{font-size:8.5px;color:#8fb3a0;letter-spacing:.9px;text-transform:uppercase}
.hl-team{font-size:13px;font-weight:700;color:#fff;margin-top:2px}
.hl-score{font-size:24px;font-weight:700;line-height:1}
.hl-score.under{color:var(--up)}
.hl-score.over{color:var(--dn)}
.hl-score.even{color:#fff}
.hl-thru{font-size:9.5px;color:var(--mid);margin-top:2px}
.tabs{display:flex;background:var(--board-hd)}
.tab{flex:1;padding:10px 2px;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8fb3a0;border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
@media(max-width:360px){.tab{font-size:10.5px;letter-spacing:.2px}}

/* Second-level tabs, sitting under the Leaderboard tab */
.subtabs{display:flex;background:var(--board-hd);border-radius:8px;overflow:hidden;margin-bottom:12px}
.subtab{flex:1;padding:11px 4px;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#8fb3a0;border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit}
.subtab.on{color:#fff;background:var(--board);border-bottom-color:var(--gold)}
.subtab:active{color:#fff}

/* ===== Layout ===== */
.wrap{max-width:800px;margin:0 auto;padding:12px 12px 48px}
.banner{background:#fff8e1;border:1px solid #f0d68a;color:#7a5d00;font-size:12px;padding:10px 12px;border-radius:6px;margin-bottom:12px;line-height:1.5}
.banner b{font-weight:700}
.banner.warn{background:var(--over-bg);border-color:#e6b3bd;color:#8d1327}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
.sess-meta{font-size:12px;color:var(--muted);margin:6px 2px 10px;line-height:1.5}

/* ===== Board ===== */
.board{background:var(--board);border-radius:8px;overflow:hidden;margin-bottom:10px}
.board-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--board-hd)}
.board-hd .t{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mid)}
.board-hd .r{font-size:9.5px;color:var(--dim)}
.bhd{display:grid;align-items:center;gap:10px;padding:7px 12px;background:var(--board-hd);font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);border-top:1px solid var(--board-line)}
.brow{display:grid;align-items:center;gap:10px;padding:11px 12px;border-left:3px solid transparent;border-top:1px solid var(--board-line)}
.brow.tap{cursor:pointer}
.brow.tap:active{background:rgba(255,255,255,.09)}
.brow.alt{background:var(--board-alt)}
.brow.lead{border-left-color:var(--gold)}
.g3{grid-template-columns:22px minmax(0,1fr) auto}
.g4{grid-template-columns:22px minmax(0,1fr) 46px 46px}
.g5{grid-template-columns:18px minmax(0,1fr) 38px 46px 52px}
.dayswitch{display:flex;gap:0;background:var(--board-hd);border-radius:8px;overflow:hidden;margin:12px 0 4px}
.dayb{flex:1;padding:10px 4px;border:none;background:transparent;color:#8fb3a0;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent}
.dayb.on{color:#fff;background:var(--board);border-bottom-color:var(--gold)}
.gs{grid-template-columns:44px 52px minmax(0,1fr) 44px}
.bnum{font-size:13px;font-weight:700;color:var(--dim)}
.brow.lead .bnum{color:var(--gold)}
.bname{font-size:13px;font-weight:700;color:#fff;letter-spacing:.2px}
.bsub{font-size:9.5px;color:var(--dim);margin-top:2px}
.bnet{text-align:right;font-size:19px;font-weight:700}
.bnet.under{color:var(--up)}
.bnet.over{color:var(--dn)}
.bnet.even{color:#fff}
.bgross{text-align:right;font-size:13px;font-weight:700;color:var(--mid)}
.bgross.under{color:var(--up)}
.bgross.over{color:var(--dn)}
.bgross.even{color:#fff}
.bgross.strokes{color:#fff}
.bthru{display:block;font-size:9.5px;font-weight:600;color:var(--dim);margin-top:2px}
.bpend{display:inline-block;font-size:10px;font-weight:700;color:var(--dim);border:1px dashed rgba(255,255,255,.22);padding:3px 10px;border-radius:11px;white-space:nowrap}
.bfoot{padding:9px 12px;background:var(--board-hd);font-size:10.5px;color:var(--dim);line-height:1.45}
.bfoot b{color:#fff}

/* ===== Skins ===== */
.sk-tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.sk-tally .c{background:var(--board);border-radius:8px;padding:11px;text-align:center}
.sk-tally .c .n{font-size:11.5px;font-weight:700;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-tally .c .v{font-size:28px;font-weight:700;line-height:1.15;margin-top:2px;color:var(--gold)}
.sk-tally .c .s{font-size:10px;color:var(--dim)}
.sk-h{font-size:14px;font-weight:700;color:#fff}
.sk-h .p{display:block;font-size:9.5px;font-weight:600;color:var(--dim);letter-spacing:0}
.sk-low{text-align:center;font-size:16px;font-weight:700;color:#fff}
.sk-low .r{display:block;font-size:9.5px;font-weight:700;color:var(--dim)}
.sk-low.none{color:var(--dim);font-size:13px}
.sk-team{font-size:12px;font-weight:600;color:#fff;line-height:1.35}
.sk-team.none{color:var(--dim);font-weight:500}
.sk-skin{text-align:center}
.sk-yes{color:var(--up);font-size:18px;font-weight:700}
.sk-tie{color:var(--dim);font-size:9px;font-weight:700;letter-spacing:.4px;font-family:inherit;background:none;border:none;border-bottom:1px dotted var(--dim);padding:2px 1px;cursor:pointer}
.sk-tie:active{color:var(--gold);border-bottom-color:var(--gold)}

/* ===== Scorecard ===== */
.sc-top{padding:12px;background:var(--board);border-radius:8px;margin-bottom:12px}
.back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--mid);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:8px}
.sc-fmt{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
.sc-team{font-size:18px;font-weight:700;color:#fff;margin-top:5px}
.sc-cells{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:11px}
.sc-cell{background:rgba(255,255,255,.08);border-radius:6px;padding:8px 10px}
.sc-cell .k{font-size:8.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8fb3a0}
.sc-cell .v{font-size:18px;font-weight:700;color:#fff;margin-top:3px;line-height:1.1}
.sc-cell .x{font-size:9.5px;color:var(--dim);margin-top:2px}
.fmt-note{font-size:11px;color:var(--mid);margin-top:10px;line-height:1.55}
.fmt-note b{color:#fff}
.nine-hd{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.hole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:520px){.hole-grid{grid-template-columns:repeat(3,1fr)}}
.hcell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 6px;text-align:center}
.hcell .hn{font-size:12px;font-weight:700;color:var(--brand)}
.hcell .hp{font-size:9.5px;color:var(--faint);margin-bottom:5px}
.hinp{height:42px;font-size:19px;font-weight:600;text-align:center;border:1px solid var(--border);border-radius:5px;background:#fff;color:var(--text);width:100%}
.hinp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(13,81,50,.15)}
.hcell .hr{font-size:10px;font-weight:700;margin-top:4px;height:12px}
.hr.under{color:var(--green)}
.hr.over{color:var(--over)}
.hr.even{color:var(--faint)}
.nine-sub{display:flex;justify-content:space-between;align-items:center;background:#f3f6f4;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:8px}
.nine-sub b{color:var(--brand);font-size:13px}

/* ===== Group scorecard — one column per player ===== */
.score-btn{border:none;background:var(--gold);color:#1a1408;font-size:11px;font-weight:800;letter-spacing:.7px;padding:9px 16px;border-radius:16px;cursor:pointer;white-space:nowrap}
.score-btn:active{transform:scale(.96);background:#d9bb7d}
.gc{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card)}
.gc-row{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr));gap:0;align-items:center;border-top:1px solid #edf0f4}
.gc-row:first-child{border-top:none}
.gc-head{background:#f3f6f4;position:sticky;top:0;z-index:2}
.gc-name{font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding:7px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid #edf0f4}
.gc-lbl{padding:4px 6px;line-height:1.15}
.gc-lbl b{font-size:13px;font-weight:700;color:var(--brand);display:block}
.gc-lbl span{font-size:9px;color:var(--faint)}
.gc-cell{border-left:1px solid #edf0f4;padding:3px}
.gci{width:100%;height:40px;font-size:18px;font-weight:600;text-align:center;border:1px solid transparent;border-radius:5px;background:#fff;color:var(--text)}
.gci:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 2px rgba(13,81,50,.15)}
.gci.under{color:var(--green);font-weight:700}
.gci.over{color:var(--over)}
.gc-sub{background:#f3f6f4}
.gc-tot9{text-align:center;font-size:14px;font-weight:700;color:var(--brand);padding:7px 2px;border-left:1px solid #edf0f4}
.gc-tot{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.gc-tot .pc{background:var(--board);border-radius:8px;padding:9px 6px;text-align:center}
.gc-tot .pc .n{font-size:10.5px;font-weight:700;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-tot .pc .v{font-size:19px;font-weight:700;margin-top:3px;color:#fff}
.gc-tot .pc .s{font-size:9px;color:var(--dim);margin-top:1px}

/* ===== Admin ===== */
.admin-wrap{text-align:center;margin-top:18px}
.admin-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #c4cdc7;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;padding:7px 16px;border-radius:16px;cursor:pointer;letter-spacing:.3px}
.admin-btn:active{background:#e4e9e6}
.alogin{max-width:300px;margin:30px auto;text-align:center}
.alogin input{width:100%;padding:11px;border:1px solid var(--border);border-radius:6px;font-size:15px;margin:10px 0;text-align:center}
.btn{display:inline-block;padding:10px 18px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.3px}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.danger{background:transparent;border-color:#d8a0a9;color:var(--over)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:active{transform:scale(.98)}
.aback{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
.atabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.atab{padding:7px 13px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.atab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.prow{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 10px;margin-bottom:7px;display:grid;grid-template-columns:minmax(0,1fr) 118px 34px;gap:7px;align-items:center}
.prow input,.prow select{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:#fafbfa}
.prow input:focus,.prow select:focus{outline:none;border-color:var(--brand);background:#fff}
.prow .x{border:none;background:transparent;color:var(--over);font-size:17px;font-weight:700;cursor:pointer;padding:4px}
.chk{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid #edf0f4;font-size:12px;font-weight:600;color:var(--brand);cursor:pointer}
.chk input{width:19px;height:19px;accent-color:var(--brand);flex:0 0 19px}
.chk.off{color:var(--faint);cursor:default}
.prow2{grid-column:1/-1;display:flex;gap:8px;margin-top:2px}
.prow2 label{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.prow2 input,.prow2 select{flex:1;min-width:0;padding:8px 6px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:#fafbfa}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.tcard .tc-hd{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.tcard select{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:#fafbfa;margin-bottom:6px}
.tcard .tc-derived{font-size:13.5px;font-weight:700;color:var(--brand);margin-top:4px}
.tcard .tc-derived.empty{color:var(--faint);font-weight:600}
.tcard .tc-bad{font-size:12px;font-weight:600;color:var(--over);margin-top:4px;line-height:1.4}
.par-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.par-grid{grid-template-columns:repeat(6,1fr)}}
.par-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px;text-align:center}
.par-cell .l{font-size:9px;color:var(--faint);text-transform:uppercase;font-weight:700;margin-bottom:4px}
.par-cell input{width:100%;padding:6px;border:1px solid var(--border);border-radius:5px;font-size:14px;text-align:center;background:#fafbfa}
.par-totals{font-size:12px;color:var(--muted);margin:10px 2px}
.reset-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;font-weight:600}
.bulk{width:100%;min-height:120px;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6;background:#fafbfa}
.conn{position:fixed;bottom:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.4px;padding:4px 10px;border-radius:12px;z-index:50}
.conn.on{background:var(--green-bg);color:var(--green)}
.conn.off{background:var(--over-bg);color:var(--over)}
</style>
</head>
<body>
<div id="app"></div>
<div id="conn" class="conn off">CONNECTING&hellip;</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   FIREBASE CONFIG
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBRJwJgTAGUHY6COl7oS1JxF4_INVeALRc",
  authDomain: "jay-davis-undos.firebaseapp.com",
  databaseURL: "https://jay-davis-undos-default-rtdb.firebaseio.com",
  projectId: "jay-davis-undos",
  storageBucket: "jay-davis-undos.firebasestorage.app",
  messagingSenderId: "982252725642",
  appId: "1:982252725642:web:9d7f96b5ae7b73937d5473"
};
const DB_PATH = 'undos';              // Saturday — must match the key in your database rules
const DAY2_PATH = 'undos-day2';       // Sunday, written only once Day 2 is started
const META_PATH = 'undos-meta';       // holds which day the whole field is on
const ADMIN_PASSWORD = "davis";       // committee password for the Admin screen
/* ============================================================ */

const NUM_HOLES = 18;
const COURSE_NAME = "Belmont Hills Country Club";
const COURSE_LOCATION = "St. Clairsville, Ohio";
const EVENT_DEFAULT = "Undo's Family Restaurant Amateur Golf Classic";

/* Par 72 — out 36 / in 36 */
const PAR_DEFAULT = [4,3,5,4,4,5,3,4,4, 5,3,5,4,3,4,4,4,4];

/* rank = playing strength, low is stronger. A better ball team plays in the
   stronger player's flight. team=false flights play individual only — no
   better ball, no skins. */
const FLIGHTS = [
  { id:'championship', label:'Championship', rank:1, team:true,  skins:true  },
  { id:'first',        label:'First',        rank:2, team:true,  skins:true  },
  { id:'senior',       label:'Senior',       rank:3, team:true,  skins:true  },
  { id:'ladies',       label:'Ladies',       rank:4, team:false, skins:false },
  { id:'junior',       label:'Junior',       rank:5, team:false, skins:false }
];
function flightOf(id){
  for (let i=0;i<FLIGHTS.length;i++) if (FLIGHTS[i].id===id) return FLIGHTS[i];
  return null;
}
function flightLabel(id){ const f=flightOf(id); return f ? f.label : 'Unassigned'; }

/* Saturday 15 August — final tee sheet. Each row is one group: the first
   two players make Team 1, the last two make Team 2. Teams are only formed for
   flights that play the better ball, so the Ladies and Junior groups produce
   none. Load it from Admin -> Tee sheet. */
const TEE_SHEET = [
  { g: 1, t:"07:50 AM", p:[["Dave Angalich","first"],["Dan Angalich","first"],["Tom Gaudino","first"],["T. C. Chappelear","first"]] },
  { g: 2, t:"08:00 AM", p:[["Doug Lucas","first"],["Corey Lyseski","first"],["Jimmy Henderson","first"],["Aidan Lucey","first"]] },
  { g: 3, t:"08:10 AM", p:[["Ray Braun","first"],["Ike Chambers","first"],["Kaleb Blackman","first"],["Justin Demarchi","first"]] },

/* The same player spelled two ways across the two days. Both spellings
   canonicalise to one key, so a card is found whichever way the name was
   typed, in either direction. */
const NAME_ALIASES = {
  'jaren straughn': 'jared straugh',
  'todd antill':    'todd antil'
};
function canonName(n){
  const k = normName(n);
  return NAME_ALIASES[k] || k;
}

/* Match on a name the way a person would: case and spacing do not matter. */
function normName(n){ return String(n||'').trim().toLowerCase().replace(/\s+/g,' '); }

function defaultState(){
  return { eventName: EVENT_DEFAULT, par: PAR_DEFAULT.slice(), players: {}, teams: {} };
}

/* ---------- Firebase / local fallback ----------
   Each day lives under its own key. Saturday is `undos` and is never written
   again once the field moves to Sunday, which is what freezes it. Both days
   are read at all times so the leaderboard can total the two together, but
   only the active day is ever written to. */
let days = { day1: defaultState(), day2: defaultState() };
let state = days.day1;
let activeDay = 'day1';
let day2Exists = false;
let db = null, ref = null, online = false;
const localMode = firebaseConfig.apiKey.indexOf("PASTE") === 0;

function setConn(on, txt){
  const el = document.getElementById('conn');
  el.className = 'conn ' + (on ? 'on' : 'off');
  el.textContent = txt;
}

if (!localMode){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    ref = db.ref(DB_PATH);

    watchDay('day1');
    /* Sunday's key and the day switch may not exist or be permitted yet. Both
       listeners fail quietly so that a rules file without them cannot disturb
       a round already being scored. */
    watchDay('day2');
    db.ref(META_PATH + '/activeDay').on('value', snap=>{
      setActiveDay(snap.val() === 'day2' ? 'day2' : 'day1');
    }, err=>{ /* not readable yet — stay on Saturday */ });
    db.ref('.info/connected').on('value', s=>{
      online = !!s.val();
      setConn(online, online ? 'LIVE SYNC' : 'OFFLINE — RETRYING');
    });
  }catch(e){
    setConn(false,'SYNC ERROR');
  }
} else {
  try{ const s = localStorage.getItem(DB_PATH); if (s){ days.day1 = normalize(JSON.parse(s)); state = days.day1; } }catch(e){}
  setConn(false,'LOCAL ONLY — NO SYNC');
}

function watchDay(id){
  const r = db.ref(DAY_KEYS[id]);
  r.on('value', snap=>{
    const v = snap.val();
    /* Saturday seeds itself on a fresh database. Sunday never does — it is
       created deliberately from Admin, so a missing key just means Day 2 has
       not been started. */
    if (v === null){
      if (id === 'day1'){ r.set(days.day1); return; }
      day2Exists = false;
      days.day2 = defaultState();
      if (activeDay === 'day2') state = days.day2;
      renderPreservingFocus();
      return;
    }
    if (id === 'day2') day2Exists = true;
    const incoming = normalize(v);
    if (JSON.stringify(incoming) === JSON.stringify(days[id])) return;
    days[id] = incoming;
    if (id === activeDay) state = days[id];
    renderPreservingFocus();
  }, err=>{
    if (id === 'day1') setConn(false, 'RULES BLOCKED — SEE ADMIN');
    /* Day 2 unreadable simply means the rules have not been published yet. */
  });
}

function setActiveDay(d){
  const next = (d === 'day2') ? 'day2' : 'day1';
  if (next === activeDay) return;
  activeDay = next;
  state = days[activeDay];
  boardDay = (activeDay === 'day2') ? 'total' : 'day1';
  render();
}

/* Firebase drops empty objects and turns sparse arrays into maps — rebuild the shape */
function toArr(v){
  if (!v) return [];
  if (Array.isArray(v)) return v;
  return Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]);
}
function normalize(v){
  const st = v || {};
  const out = { eventName: st.eventName || EVENT_DEFAULT, players:{}, teams:{} };

  const par = toArr(st.par);
  out.par = Array.from({length:NUM_HOLES},(_,i)=>{
    const p = parseInt(par[i]);
    return (p>=3 && p<=6) ? p : PAR_DEFAULT[i];
  });

  const ps = st.players || {};
  Object.keys(ps).forEach(id=>{
    const p = ps[id] || {};
    const g = parseInt(p.grp), o = parseInt(p.ord);
    out.players[id] = {
      name: p.name || '',
      flight: flightOf(p.flight) ? p.flight : 'championship',
      tee: p.tee || '',
      grp: isNaN(g) ? 0 : g,
      ord: isNaN(o) ? 0 : o,
      skins: p.skins !== false,
      scores: p.scores || {}
    };
  });

  const ts = st.teams || {};
  Object.keys(ts).forEach(id=>{
    const t = ts[id] || {};
    out.teams[id] = { a: t.a || '', b: t.b || '' };
  });

  return out;
}

function persist(path, value){
  if (!localMode && db){
    db.ref(DAY_KEYS[activeDay] + (path ? '/' + path : '')).set(value);
  } else {
    try{ localStorage.setItem(DAY_KEYS[activeDay], JSON.stringify(state)); }catch(e){}
  }
}

/* ---------- Helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtRel(n){ return n===0 ? 'E' : (n>0 ? '+'+n : String(n)); }
function relClass(n){ return n===0 ? 'even' : (n>0 ? 'over' : 'under'); }
function lastName(s){
  const parts = String(s||'').trim().split(/\s+/).filter(Boolean);
  return parts.length ? parts[parts.length-1] : '';
}
function totalPar(){ return state.par.reduce((a,b)=>a+b,0); }

/* players as a sorted array, so the order is stable on every phone */
function playerList(){
  return Object.keys(state.players)
    .map(id=>({ id, p: state.players[id] }))
    .sort((x,y)=>{
      const a = lastName(x.p.name) || x.p.name || '', b = lastName(y.p.name) || y.p.name || '';
      return a.localeCompare(b) || x.id.localeCompare(y.id);
    });
}
function teamList(){
  return Object.keys(state.teams)
    .map(id=>({ id, t: state.teams[id] }))
    .sort((x,y)=>x.id.localeCompare(y.id));
}
function playerNameOf(id){
  const p = state.players[id];
  return p && p.name ? p.name : '';
}

/* ---------- Scoring — everything is gross strokes ---------- */
function holeScore(p, h){
  const v = parseInt((p.scores||{})['h'+h]);
  return (v>0) ? v : null;
}
function playerResult(p){
  let strokes=0, parSum=0, thru=0;
  for (let h=0; h<NUM_HOLES; h++){
    const v = holeScore(p, h);
    if (v!==null){ strokes+=v; parSum+=state.par[h]; thru++; }
  }
  return { strokes, parSum, thru, toPar: thru?strokes-parSum:0, done: thru===NUM_HOLES };
}
/* back nine, then last six, then last three, then 18 */
function cardOff(a, b){
  const seg = [[9,18],[12,18],[15,18],[17,18]];
  for (let s=0;s<seg.length;s++){
    let av=0, an=0, bv=0, bn=0;
    for (let h=seg[s][0]; h<seg[s][1]; h++){
      const x = holeScore(a,h), y = holeScore(b,h);
      if (x!==null){ av+=x; an++; }
      if (y!==null){ bv+=y; bn++; }
    }
    if (an===0 || bn===0) continue;
    if (av!==bv) return av-bv;
  }
  return 0;
}
/* ---------- Two-day scoring ----------
   playerResult above works on the active day and drives scoring, the tee
   sheet and the skins. The leaderboard needs any day, or both added together,
   so it goes through these instead. Each day keeps its own par, so a change
   to the card on Sunday cannot rewrite Saturday's score to par. */
/* Names indexed per day, so a card can still be found when the two days were
   not built from one another and the ids differ. A name shared by two players
   is dropped from the index rather than guessed at. Rebuilt only when that
   day's data is replaced. */
const _nameIdx = { day1: { src: null, idx: null }, day2: { src: null, idx: null } };
function dayNameIndex(dayId){
  const st = days[dayId];
  const cache = _nameIdx[dayId];
  if (cache.src === st) return cache.idx;
  const idx = {}, dupe = {};
  Object.keys(st.players || {}).forEach(id=>{
    const n = canonName(st.players[id].name);
    if (!n) return;
    if (idx[n] !== undefined) dupe[n] = true; else idx[n] = id;
  });
  Object.keys(dupe).forEach(n=>{ delete idx[n]; });
  cache.src = st; cache.idx = idx;
  return idx;
}
/* The same player in another day: by id first, then by name. The id is the
   reliable link, but a Sunday roster built any other way than from Saturday
   would have new ids and silently lose every first round. */
function playerInDay(pid, dayId){
  const st = days[dayId];
  if (!st || !st.players) return null;
  if (st.players[pid]) return st.players[pid];
  const src = (state.players && state.players[pid]) || days.day1.players[pid] || days.day2.players[pid];
  if (!src || !src.name) return null;
  const other = dayNameIndex(dayId)[canonName(src.name)];
  return other ? st.players[other] : null;
}

function roundFor(pid, dayId){
  const st = days[dayId];
  const p = playerInDay(pid, dayId);
  if (!p) return { strokes:0, parSum:0, thru:0, toPar:0, done:false, played:false };
  let strokes=0, parSum=0, thru=0;
  for (let h=0; h<NUM_HOLES; h++){
    const v = parseInt((p.scores||{})['h'+h]);
    if (v>0){ strokes+=v; parSum+=st.par[h]; thru++; }
  }
  return { strokes, parSum, thru, toPar: thru?strokes-parSum:0, done: thru===NUM_HOLES, played: thru>0 };
}
/* mode is 'total', 'day1' or 'day2'. */
function resultFor(pid, mode){
  if (mode !== 'total') return roundFor(pid, mode);
  const a = roundFor(pid, 'day1'), b = roundFor(pid, 'day2');
  const thru = a.thru + b.thru, strokes = a.strokes + b.strokes, parSum = a.parSum + b.parSum;
  return { strokes, parSum, thru, toPar: thru?strokes-parSum:0, done: a.done && b.done, played: thru>0, r1:a, r2:b };
}
function teamRoundFor(t, dayId){
  const st = days[dayId];
  const ps = [t.a, t.b].map(id=>playerInDay(id, dayId)).filter(Boolean);
  let strokes=0, parSum=0, thru=0;
  for (let h=0; h<NUM_HOLES; h++){
    let best = null;
    ps.forEach(pl=>{
      const v = parseInt((pl.scores||{})['h'+h]);
      if (v>0 && (best===null || v<best)) best = v;
    });
    if (best!==null){ strokes+=best; parSum+=st.par[h]; thru++; }
  }
  return { strokes, parSum, thru, toPar: thru?strokes-parSum:0, done: thru===NUM_HOLES, played: thru>0 };
}
function teamResultFor(t, mode){
  if (mode !== 'total') return teamRoundFor(t, mode);
  const a = teamRoundFor(t, 'day1'), b = teamRoundFor(t, 'day2');
  const thru = a.thru + b.thru, strokes = a.strokes + b.strokes, parSum = a.parSum + b.parSum;
  return { strokes, parSum, thru, toPar: thru?strokes-parSum:0, done: a.done && b.done, played: thru>0, r1:a, r2:b };
}
/* Matching cards on the most recent round played, then the one before. */
function cardOffDays(pidA, pidB, mode){
  const order = mode === 'total' ? ['day2','day1'] : [mode];
  for (let i=0;i<order.length;i++){
    const st = days[order[i]];
    const a = st.players[pidA], b = st.players[pidB];
    if (!a || !b) continue;
    const d = cardOffIn(a, b, st);
    if (d !== 0) return d;
  }
  return 0;
}
function cardOffIn(a, b, st){
  const seg = [[9,18],[12,18],[15,18],[17,18]];
  for (let s=0;s<seg.length;s++){
    let av=0, an=0, bv=0, bn=0;
    for (let h=seg[s][0]; h<seg[s][1]; h++){
      const x = parseInt((a.scores||{})['h'+h]), y = parseInt((b.scores||{})['h'+h]);
      if (x>0){ av+=x; an++; }
      if (y>0){ bv+=y; bn++; }
    }
    if (an===0 || bn===0) continue;
    if (av!==bv) return av-bv;
  }
  return 0;
}
function rankPlayersBy(list, mode){
  return list.slice().sort((x,y)=>{
    const a = resultFor(x.id, mode), b = resultFor(y.id, mode);
    if (a.played !== b.played) return a.played ? -1 : 1;
    if (a.toPar !== b.toPar) return a.toPar - b.toPar;
    if (a.thru !== b.thru) return b.thru - a.thru;
    return cardOffDays(x.id, y.id, mode);
  });
}
function rankTeamsBy(list, mode){
  return list.slice().sort((x,y)=>{
    const a = teamResultFor(x.t, mode), b = teamResultFor(y.t, mode);
    if (a.played !== b.played) return a.played ? -1 : 1;
    if (a.toPar !== b.toPar) return a.toPar - b.toPar;
    return b.thru - a.thru;
  });
}

/* Rank on score to par, not raw strokes: mid-round a player thru 9 has a
   smaller total than one who has finished, and sorting on the total alone
   would put them ahead. To par compares the two fairly. */
function rankPlayers(list){
  return list.slice().sort((x,y)=>{
    const a = playerResult(x.p), b = playerResult(y.p);
    if ((a.thru>0) !== (b.thru>0)) return a.thru>0 ? -1 : 1;
    if (a.toPar !== b.toPar) return a.toPar - b.toPar;
    if (a.thru !== b.thru) return b.thru - a.thru;   // more holes played breaks the tie
    return cardOff(x.p, y.p);
  });
}

/* Better ball — the team takes its best score on each hole. A hole counts as
   soon as one partner posts it. */
function teamMembers(t){
  return [t.a, t.b].filter(id=>id && state.players[id]).map(id=>({ id, p: state.players[id] }));
}
function teamProblem(t){
  const ms = teamMembers(t);
  if (ms.length < 2) return 'Needs two players.';
  for (let i=0;i<ms.length;i++){
    const f = flightOf(ms[i].p.flight);
    if (f && !f.team) return f.label + ' flight plays individual only — ' + (ms[i].p.name||'this player') + ' cannot be on a team.';
  }
  if (ms[0].id === ms[1].id) return 'Same player twice.';
  return '';
}
function teamFlight(t){
  const ms = teamMembers(t).filter(m=>{ const f=flightOf(m.p.flight); return f && f.team; });
  if (!ms.length) return null;
  let best = ms[0];
  ms.forEach(m=>{ if (flightOf(m.p.flight).rank < flightOf(best.p.flight).rank) best = m; });
  return best.p.flight;
}
function teamHole(t, h){
  let best = null;
  teamMembers(t).forEach(m=>{
    const v = holeScore(m.p, h);
    if (v!==null && (best===null || v<best)) best = v;
  });
  return best;
}
function teamResult(t){
  let strokes=0, parSum=0, thru=0;
  for (let h=0; h<NUM_HOLES; h++){
    const v = teamHole(t, h);
    if (v!==null){ strokes+=v; parSum+=state.par[h]; thru++; }
  }
  return { strokes, parSum, thru, toPar: thru?strokes-parSum:0, done: thru===NUM_HOLES };
}
function rankTeams(list){
  return list.slice().sort((x,y)=>{
    const a = teamResult(x.t), b = teamResult(y.t);
    if ((a.thru>0) !== (b.thru>0)) return a.thru>0 ? -1 : 1;
    if (a.toPar !== b.toPar) return a.toPar - b.toPar;
    return b.thru - a.thru;
  });
}

/* ---------- Skins — Championship, First and Senior only ---------- */
/* Two gates on the skins. The flight is a condition of the tournament — Ladies
   and Junior are never in it. The second is paying in: everyone in an eligible
   flight counts by default and the committee unticks whoever did not pay. A
   player with no flag stored is in, so cards already on the board when this
   was added carry on showing. */
function skinsFlightOk(p){
  const f = flightOf(p.flight);
  return !!(f && f.skins);
}
function skinsField(){
  return playerList().filter(x=>skinsFlightOk(x.p) && x.p.skins !== false);
}
/** Everyone the skins could include, paid or not — used for the "x of y" line. */
function skinsPossible(){
  return playerList().filter(x=>skinsFlightOk(x.p));
}
function skinsRows(){
  const field = skinsField();
  const rows = [];
  for (let h=0; h<NUM_HOLES; h++){
    let best=null, winners=[];
    field.forEach(x=>{
      const v = holeScore(x.p, h);
      if (v===null) return;
      if (best===null || v<best){ best=v; winners=[x.id]; }
      else if (v===best) winners.push(x.id);
    });
    rows.push({ h, best, winners, skin: best!==null && winners.length===1 });
  }
  return rows;
}
function skinsWonBy(rows, id){
  return rows.filter(r=>r.skin && r.winners[0]===id).length;
}

/* ---------- View state ---------- */
let view = 'tees';            // tees | board | skins | admin

let skinsHole = null;
let adminOk = false;

let bulkMsg = '';

/* ---------- Render ---------- */
function render(){

      </div>
    </div>

    html += `
    <div class="hdr-lead">
      <div>

        <div class="hl-team">${esc(leader.p.name || 'Unnamed')}</div>

/* Leaderboard is a section rather than a single list: the better ball and the

/* Only worth showing once Sunday is under way — until then there is one round
   and nothing to switch between. */
function renderDaySwitch(){
  if (activeDay !== 'day2' && !day2Exists) return '';
  const opt = (id, label) => `<button class="dayb ${boardDay===id?'on':''}" onclick="setBoardDay('${id}')">${label}</button>`;
  return `<div class="dayswitch">
    ${opt('total','36-hole total')}${opt('day1','Saturday')}${opt('day2','Sunday')}
  </div>`;
}
function setBoardDay(d){ boardDay = d; render(); }

/* The leaderboard shows both rounds and the total once Sunday exists. */
/* A round in progress reads to par with the holes played, because a running
   stroke count means nothing until the card is finished. Once it is finished
   the number that matters is the score itself, so the cell switches to the
   total. */
function roundCell(r){
  if (!r.played) return `<div class="bgross">—<span class="bthru">to play</span></div>`;
  if (r.done)    return `<div class="bgross strokes">${r.strokes}</div>`;
  return `<div class="bgross ${relClass(r.toPar)}">${fmtRel(r.toPar)}<span class="bthru">thru ${r.thru}</span></div>`;
}
/* The two-day total carries its stroke count only once both rounds are in. */
function totalCell(r){
  const complete = r.r1 && r.r2 && r.r1.done && r.r2.done;
  return `<div class="bnet ${relClass(r.toPar)}">${r.played?fmtRel(r.toPar):'—'}<span class="bthru">${complete?r.strokes:''}</span></div>`;
}

function boardCols(){
  return (boardDay === 'total' && (activeDay === 'day2' || day2Exists));
}

          ${roundCell(r.r2)}
          ${totalCell(r)}

        html += `<div class="brow g5 ${lead?'lead':''} ${i%2?'alt':''}">

function renderSkins(){
  const field = skinsField();
  const possible = skinsPossible();
  if (!field.length){
    if (!possible.length){
      return `<div class="banner">Skins are played by the Championship, First and Senior flights. Nobody in those flights yet.</div>`;
    }
    return `<div class="banner warn"><b>Nobody is in the skins.</b><br>
      ${possible.length} players are in an eligible flight but every one has been unticked under
      <b>Admin &rarr; Players</b>. Tick anyone who paid, or use <b>All in</b> there.</div>`;
  }
  const rows = skinsRows();
  const played = rows.filter(r=>r.best!==null).length;
  const won = rows.filter(r=>r.skin).length;
  const tied = played - won;

  const winners = field.map(x=>({ x, n: skinsWonBy(rows, x.id) }))
    .filter(w=>w.n>0)
    .sort((a,b)=> b.n - a.n || (a.x.p.name||'').localeCompare(b.x.p.name||''));

  let html = '';
  if (winners.length){
    html += `<div class="sk-tally">`;
    winners.forEach(w=>{
      html += `<div class="c">
        <div class="n">${esc(w.x.p.name||'Unnamed')}</div>
        <div class="v">${w.n}</div>
        <div class="s">skin${w.n===1?'':'s'}</div>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="banner">No skins won yet — a hole only pays out when one player owns the low score outright.</div>`;
  }

  html += `<div class="board">
    <div class="board-hd"><span class="t">Skins by hole</span><span class="r">${won} won &middot; ${tied} tied &middot; ${NUM_HOLES-played} to play</span></div>
    <div class="bhd gs"><span>Hole</span><span style="text-align:center">Low</span><span>Player</span><span style="text-align:center">Skin</span></div>`;

  rows.forEach((r,i)=>{
    let low, who, skin;
    if (r.best===null){
      low = `<div class="sk-low none">—</div>`;
      who = `<div class="sk-team none">Not played</div>`;
      skin = `<div class="sk-skin"></div>`;
    } else {
      const rel = r.best - state.par[r.h];
      low = `<div class="sk-low">${r.best}<span class="r">${fmtRel(rel)}</span></div>`;
      who = r.skin
        ? `<div class="sk-team">${esc(playerNameOf(r.winners[0])||'Unnamed')}</div>`
        : `<div class="sk-team none">${r.winners.length} tied</div>`;
      skin = r.skin
        ? `<div class="sk-skin"><span class="sk-yes">&#10003;</span></div>`
        : `<div class="sk-skin"><button class="sk-tie" onclick="openSkin(${r.h})">TIED</button></div>`;
    }
    html += `<div class="brow gs ${r.skin?'lead':''} ${i%2?'alt':''}">
      <div class="sk-h">${r.h+1}<span class="p">par ${state.par[r.h]}</span></div>
      ${low}${who}${skin}
    </div>`;
  });

  html += `<div class="bfoot">Low <b>gross</b> on the hole wins the skin. A tie pushes and nobody takes it — tap TIED to see who. <b>${field.length}</b> of ${possible.length} eligible players are in; anyone unticked in Admin is left out. <b>Ladies and Junior flights are not included</b>.</div>`;
  html += `</div>`;
  return html;
}

function renderSkinDetail(){
  const h = skinsHole;
  const row = skinsRows()[h];
  let html = `<button class="aback" onclick="closeSkin()">&#8592; Skins</button>`;
  html += `<div class="board">
    <div class="board-hd"><span class="t">Hole ${h+1}</span><span class="r">par ${state.par[h]}</span></div>`;
  if (row.best===null){
    html += `<div class="bfoot">Nobody has posted this hole yet.</div></div>`;
    return html;
  }
  const rel = row.best - state.par[h];
  html += `<div class="bhd g3"><span></span><span>${row.winners.length} player${row.winners.length===1?'':'s'} at ${row.best} (${fmtRel(rel)})</span><span style="text-align:right">Score</span></div>`;
  row.winners.forEach((id,i)=>{
    const p = state.players[id];
    html += `<div class="brow g3 ${i%2?'alt':''}">
      <div class="bnum">${i+1}</div>
      <div><div class="bname">${esc(p?p.name:'Unnamed')}</div><div class="bsub">${esc(flightLabel(p?p.flight:''))}</div></div>
      <div class="bnet even">${row.best}</div>
    </div>`;
  });
  html += `<div class="bfoot">${row.skin ? 'Won outright — this player takes the skin.' : 'Tied for low, so the skin pushes and nobody takes this hole.'}</div>`;
  html += `</div>`;
  return html;
}

/* Everyone in the group on one card: one column per player, one row per hole.
   Whoever is keeping the card for the foursome enters all four scores here. */
function groupPlayers(g){
  return playerList().filter(x=>x.p.grp===g).sort((a,b)=>(a.p.ord||0)-(b.p.ord||0));
}

/* Column headings for a group. Surnames are the natural label, but a foursome
   often contains brothers — Dave and Dan Angalich go out together — and two
   columns both reading "Angalich" is worse than useless when you are entering
   their scores. Fall back to the first name, then to the full name. */
function columnLabels(ps){
  const first = ps.map(x=>String(x.p.name||'').trim().split(/\s+/)[0] || '');
  const last  = ps.map(x=>lastName(x.p.name) || x.p.name || '');
  const count = (arr, v) => arr.filter(z=>z===v).length;
  return ps.map((x,i)=>{
    if (count(last, last[i]) === 1) return last[i];
    if (count(first, first[i]) === 1) return first[i];
    return x.p.name || last[i];
  });
}

function renderGroupCard(){
  const g = scoringGrp;
  const ps = groupPlayers(g);
  if (!ps.length){ scoringGrp=null; return renderTees(); }
  const n = ps.length;

  let html = `
  <div class="sc-top">
    <button class="back" onclick="closeScore()">&#8592; Tee times</button>
    <div class="sc-fmt">Group ${g} &middot; ${esc(ps[0].p.tee||'')}</div>
    <div class="sc-team">${columnLabels(ps).map(esc).join(' &middot; ')}</div>
    <div class="fmt-note">Enter every player's strokes on each hole. These cards feed the individual leaderboard, the better ball and the skins.</div>
  </div>`;

  const labels = columnLabels(ps);
  html += gcNine(ps, labels, 0, 'Front nine');
  html += gcNine(ps, labels, 9, 'Back nine');

  html += `<div class="nine-hd">Totals</div><div class="gc-tot" style="--n:${n}">`;
  ps.forEach((x,i)=>{
    const r = playerResult(x.p);
    html += `<div class="pc">
      <div class="n">${esc(labels[i])}</div>
      <div class="v">${r.thru?r.strokes:'—'}</div>
      <div class="s">${r.thru?fmtRel(r.toPar)+' · '+(r.done?'F':'thru '+r.thru):'no scores'}</div>
    </div>`;
  });
  html += `</div>`;

  html += `<div style="margin-top:16px"><button class="btn" onclick="closeScore()">Done — back to tee times</button></div>`;
  return html;
}

function gcNine(ps, labels, from, label){
  const n = ps.length;
  let html = `<div class="nine-hd">${label}</div><div class="gc" style="--n:${n}">`;

  html += `<div class="gc-row gc-head">
    <div class="gc-lbl">Hole</div>
    ${ps.map((x,i)=>`<div class="gc-name">${esc(labels[i])}</div>`).join('')}
  </div>`;

  for (let h=from; h<from+9; h++){
    html += `<div class="gc-row">
      <div class="gc-lbl"><b>${h+1}</b><span>par ${state.par[h]}</span></div>
      ${ps.map(x=>{
        const v = holeScore(x.p, h);
        const rel = v===null ? '' : relClass(v - state.par[h]);
        return `<div class="gc-cell"><input class="gci ${rel}" id="in_${x.id}_${h}" type="number" inputmode="numeric" min="1" max="20"
          value="${v===null?'':v}" oninput="setScore('${x.id}',${h},this.value)"></div>`;
      }).join('')}
    </div>`;
  }

  html += `<div class="gc-row gc-sub">
    <div class="gc-lbl"><b>${from===0?'Out':'In'}</b><span>par ${state.par.slice(from,from+9).reduce((a,b)=>a+b,0)}</span></div>
    ${ps.map(x=>{
      let sum=0, cnt=0;
      for (let h=from; h<from+9; h++){ const v=holeScore(x.p,h); if(v!==null){ sum+=v; cnt++; } }
      return `<div class="gc-tot9">${cnt?sum:'—'}</div>`;
    }).join('')}
  </div>`;

  html += `</div>`;
  return html;
}

function renderTees(){
  const list = playerList().filter(x=>x.p.grp);
  if (!list.length){
    return `<div class="banner">No tee times loaded yet. Load the sheet from <b>Admin &rarr; Tee sheet</b> — the Admin button is at the bottom of the Leaderboard tab.</div>`;
  }
  const groups = {};
  list.forEach(x=>{ (groups[x.p.grp] = groups[x.p.grp] || []).push(x); });
  Object.keys(groups).forEach(k=>{ groups[k].sort((a,b)=>(a.p.ord||0)-(b.p.ord||0)); });
  const nums = Object.keys(groups).map(Number).sort((a,b)=>a-b);

  let html = `<div class="banner">Saturday pairings. The first two names in a group are <b>Team 1</b>, the last two are <b>Team 2</b>. <b>Tap SCORE to enter the whole group's card.</b></div>`;
  html += `<div class="board">
    <div class="board-hd"><span class="t">Tee times</span><span class="r">${nums.length} groups &middot; ${list.length} players</span></div>`;
  nums.forEach((g,i)=>{
    const ps = groups[g];
    const done = ps.filter(x=>playerResult(x.p).done).length;
    const started = ps.filter(x=>playerResult(x.p).thru>0).length;
    html += `<div class="brow g3 ${i%2?'alt':''}" style="cursor:default">
      <div class="bnum">${g}</div>
      <div>
        <div class="bname">${esc(ps[0].p.tee||'')}</div>
        <div class="bsub">${ps.length} players${started?' &middot; '+(done===ps.length?'all in':started+' scoring'):''}</div>
      </div>
      <div><button class="score-btn" onclick="openGroup(${g})">SCORE</button></div>
    </div>`;
    ps.forEach(x=>{
      const r = playerResult(x.p);
      html += `<div class="brow g4 ${i%2?'alt':''}" style="border-top:none;padding-top:5px;padding-bottom:5px;cursor:default">
        <div class="bnum"></div>
        <div><div class="bname" style="font-weight:600">${esc(x.p.name||'Unnamed')}</div>
          <div class="bsub">${esc(flightLabel(x.p.flight))}</div></div>
        <div class="bgross">${r.thru?fmtRel(r.toPar):'—'}</div>
        <div class="bgross">${r.thru?(r.done?'F':r.thru):''}</div>
      </div>`;
    });
  });

  html += `<div class="bfoot">Teams are the two names above and the two below inside each group. Ladies and Junior groups play individually.</div>`;
  html += `</div>`;
  return html;
}

function grpOpts(p){
  let o = `<option value="" ${!p.grp?'selected':''}>— none —</option>`;
  const groups = groupsInUse();
  let found = false;
  groups.forEach(g=>{
    if (g.n === p.grp) found = true;
    o += `<option value="${g.n}" ${g.n===p.grp?'selected':''}>${g.n}${g.tee?' &middot; '+esc(g.tee):''}</option>`;
  });
  if (p.grp && !found) o += `<option value="${p.grp}" selected>${p.grp}</option>`;
  o += `<option value="__new">New group&hellip;</option>`;
  return o;
}
function teeOpts(p){
  let o = `<option value="" ${!p.tee?'selected':''}>— none —</option>`;
  const times = teeTimesInUse();
  if (p.tee && times.indexOf(p.tee) < 0) times.push(p.tee);
  times.sort((a,b)=>teeMinutes(a)-teeMinutes(b));
  times.forEach(t=>{ o += `<option value="${esc(t)}" ${t===p.tee?'selected':''}>${esc(t)}</option>`; });
  o += `<option value="__other">Other&hellip;</option>`;
  return o;
}

function renderAdmin(){

  html += `<div class="atabs">
    <button class="atab ${adminTab==='day'?'on':''}" onclick="setAtab('day')">Day</button>

    <button class="atab ${adminTab==='teams'?'on':''}" onclick="setAtab('teams')">Teams</button>

  </div>`;

  if (adminTab==='day'){
    const d1 = Object.keys(days.day1.players).length;
    const d2 = Object.keys(days.day2.players).length;
    html += `<div class="sess-meta">The field is scoring <b>${esc(DAY_LABELS[activeDay])}</b>. Each day is stored separately — moving to Sunday leaves Saturday untouched and every phone follows within a second. The leaderboard adds the two rounds together.</div>`;
    html += `<div class="reset-row"><span>Saturday<br><small style="font-weight:500;color:var(--muted)">${d1} players${activeDay==='day1'?' &middot; being scored now':' &middot; finished'}</small></span>
      ${activeDay==='day1' ? '<b style="color:var(--brand);font-size:12px">ACTIVE</b>' : `<button class="btn ghost sm" onclick="switchDay('day1')">Go back</button>`}</div>`;
    html += `<div class="reset-row"><span>Sunday<br><small style="font-weight:500;color:var(--muted)">${day2Exists ? d2 + ' players' : 'not started'}</small></span>
      ${activeDay==='day2' ? '<b style="color:var(--brand);font-size:12px">ACTIVE</b>' : (day2Exists ? `<button class="btn sm" onclick="switchDay('day2')">Switch the field to Sunday</button>` : '')}</div>`;

    if (!day2Exists){
      html += `<div class="banner"><b>Starting Sunday</b> copies every player and better ball team across with the same names, flights and partners, and <b>no scores</b>. Saturday is left exactly as it is. Do this once Saturday's cards are all in.</div>`;
      html += `<div style="margin:12px 0"><button class="btn" onclick="startDay2()">Start Sunday from Saturday's field</button></div>`;
    } else if (activeDay === 'day1'){
      html += `<div class="banner">Sunday is set up with ${d2} players. <b>Switch the field to Sunday</b> when you are ready — every phone moves over and scoring goes into Sunday's card.</div>`;
      html += `<div style="margin:12px 0"><button class="btn danger sm" onclick="rebuildDay2()">Rebuild Sunday from Saturday</button>
        <span style="font-size:12px;color:var(--muted);margin-left:8px">wipes Sunday's scores</span></div>`;
    }
    /* Say plainly whether the carryover is actually landing, and how it is
       being matched, rather than leaving a blank R1 column to be puzzled over. */
    if (day2Exists){
      const roster = Object.keys(days[activeDay].players);
      const otherId = activeDay === 'day2' ? 'day1' : 'day2';
      let byId = 0, byName = 0, none = 0, withScores = 0;
      roster.forEach(id=>{
        const other = days[otherId].players[id];
        const viaName = other ? null : playerInDay(id, otherId);
        if (other) byId++; else if (viaName) byName++; else none++;
        const p = other || viaName;
        if (p && Object.keys(p.scores || {}).length) withScores++;
      });
      /* The check above walks the active day. Anyone in the other day with no
         card here never reaches the leaderboard at all, which is the more
         costly direction to miss, so look both ways. */
      const hereIdx = dayNameIndex(activeDay);
      const orphans = Object.keys(days[otherId].players)
        .filter(id=>!days[activeDay].players[id] && hereIdx[canonName(days[otherId].players[id].name)] === undefined)
        .map(id=>days[otherId].players[id].name || 'Unnamed');
      const ok = (byId + byName) === roster.length && roster.length > 0 && !orphans.length;
      html += `<div class="banner ${ok?'':'warn'}">

    html += `<div class="reset-row"><span>All teams (roster kept)</span><button class="btn danger sm" onclick="clearTeams()">Clear teams</button></div>`;

  return html;
}

/* ---------- Actions ---------- */
function go(v){ view=v; scoringGrp=null; skinsHole=null; bulkMsg=''; render(); window.scrollTo(0,0); }
function openSkin(h){ skinsHole=h; render(); window.scrollTo(0,0); }
function closeSkin(){ skinsHole=null; render(); window.scrollTo(0,0); }
function setAtab(t){ adminTab=t; bulkMsg=''; render(); }
function setBoardTab(t){ boardTab=t; render(); window.scrollTo(0,0); }
function openGroup(g){ scoringGrp=g; render(); window.scrollTo(0,0); }
function closeScore(){ scoringGrp=null; view='tees'; render(); window.scrollTo(0,0); }
function tryPwd(){
  const el = document.getElementById('pwd');
  if (el.value === ADMIN_PASSWORD){ adminOk=true; render(); }
  else { el.value=''; el.placeholder='Wrong password'; }
}

function clampScore(val){
  const n = parseInt(val);
  return (val === '' || isNaN(n)) ? null : Math.max(1, Math.min(20, n));
}
function setScore(id, h, val){
  const p = state.players[id];
  if (!p) return;
  const v = clampScore(val);
  if (!p.scores) p.scores = {};
  if (v===null) delete p.scores['h'+h];
  else p.scores['h'+h] = v;
  persist('players/' + id + '/scores/h' + h, v);
  renderPreservingFocus();
}

function addPlayer(){
  const id = newId();
  state.players[id] = { name:'', flight:'championship', tee:'', grp:0, ord:0, skins:true, scores:{} };
  persist('players/' + id, { name:'', flight:'championship' });
  render();
  const el = document.getElementById('pn_' + id);
  if (el) el.focus();
}
function setPlayerName(id, val){
  if (!state.players[id]) return;
  state.players[id].name = val;
  persist('players/' + id + '/name', val);
  render();
}
function setPlayerFlight(id, val){
  if (!state.players[id]) return;
  state.players[id].flight = val;
  persist('players/' + id + '/flight', val);
  /* A player who moves to Ladies or Junior cannot stay on a team. */
  const f = flightOf(val);
  if (f && !f.team){
    teamList().forEach(x=>{
      if (x.t.a===id){ x.t.a=''; persist('teams/'+x.id+'/a', ''); }
      if (x.t.b===id){ x.t.b=''; persist('teams/'+x.id+'/b', ''); }
    });
  }
  render();
}
/* Put a player in a tee-time group. The tee time comes from whoever is already
   in that group, so the two never drift apart, and they go on the end of the
   group rather than displacing anyone. */
function setPlayerGrp(id, val){
  const p = state.players[id];
  if (!p) return;
  const g = Math.max(0, Math.min(200, parseInt(val) || 0));
  p.grp = g;
  const others = playerList().filter(x=>x.id!==id && x.p.grp===g);
  p.ord = others.length;
  persist('players/' + id + '/grp', g);
  persist('players/' + id + '/ord', p.ord);
  /* Take the time from the group being joined. Moving a player from the 7:50
     to the 10:20 has to move their tee time as well, or the sheet shows them
     in one group at another group's time. */
  const tee = g && others.length ? (others[0].p.tee || '') : '';
  if (tee !== p.tee){
    p.tee = tee;
    persist('players/' + id + '/tee', tee);
  }
  render();
}
/* Sort tee times by the clock rather than alphabetically, so 07:50 AM comes
   before 10:20 AM and the afternoon follows the morning. */
function teeMinutes(t){
  const m = /^(\d{1,2}):(\d{2})\s*([AP])M$/i.exec(String(t||'').trim());
  if (!m) return 1e9;
  let h = parseInt(m[1], 10) % 12;
  if (m[3].toUpperCase() === 'P') h += 12;
  return h * 60 + parseInt(m[2], 10);
}
function teeTimesInUse(){
  const seen = {};
  playerList().forEach(x=>{ if (x.p.tee) seen[x.p.tee] = true; });
  return Object.keys(seen).sort((a,b)=>teeMinutes(a)-teeMinutes(b));
}
/** Groups already on the sheet, each with the time it goes out. */
function groupsInUse(){
  const g = {};
  playerList().forEach(x=>{
    if (!x.p.grp) return;
    if (!g[x.p.grp]) g[x.p.grp] = x.p.tee || '';
  });
  return Object.keys(g).map(Number).sort((a,b)=>a-b).map(n=>({ n: n, tee: g[n] }));
}

function setPlayerSkins(id, on){
  const p = state.players[id];
  if (!p) return;
  p.skins = !!on;
  persist('players/' + id + '/skins', p.skins);
  render();
}
/* Bulk in or out, for the eligible flights only — the Ladies and Junior
   flights stay out of the skins whatever this is set to. */
function setAllSkins(on){
  const targets = skinsPossible();
  if (!confirm((on ? 'Mark all ' : 'Take all ') + targets.length + ' eligible players ' + (on ? 'into' : 'out of') + ' the skins?')) return;
  targets.forEach(x=>{
    state.players[x.id].skins = !!on;
    persist('players/' + x.id + '/skins', !!on);
  });
  render();
}

function pickPlayerGrp(id, val){
  if (val === '__new'){
    const v = prompt('Group number for this player');
    if (v === null){ render(); return; }
    setPlayerGrp(id, v);
    return;
  }
  setPlayerGrp(id, val);
}
function pickPlayerTee(id, val){
  if (val === '__other'){
    const v = prompt('Tee time, e.g. 10:20 AM');
    if (v === null){ render(); return; }
    setPlayerTee(id, v);
    return;
  }
  setPlayerTee(id, val);
}

function setPlayerTee(id, val){
  const p = state.players[id];
  if (!p) return;
  p.tee = String(val || '').trim().slice(0, 20);
  persist('players/' + id + '/tee', p.tee);
  render();
}

function removePlayer(id){
  const p = state.players[id];
  if (!confirm('Remove ' + ((p&&p.name)||'this player') + ' and their scores?')) return;
  delete state.players[id];
  persist('players/' + id, null);
  teamList().forEach(x=>{
    if (x.t.a===id){ x.t.a=''; persist('teams/'+x.id+'/a', ''); }
    if (x.t.b===id){ x.t.b=''; persist('teams/'+x.id+'/b', ''); }
  });
  render();
}

function addTeam(){
  const id = newId();
  state.teams[id] = { a:'', b:'' };
  persist('teams/' + id, { a:'', b:'' });
  render();
}
function setTeamSlot(id, slot, val){
  if (!state.teams[id]) return;
  state.teams[id][slot] = val;
  persist('teams/' + id + '/' + slot, val);
  render();
}
function removeTeam(id){
  if (!confirm('Remove this team? Individual scores are kept.')) return;
  delete state.teams[id];
  persist('teams/' + id, null);
  render();
}

function setEventName(val){
  state.eventName = String(val||'').trim() || EVENT_DEFAULT;
  persist('eventName', state.eventName);
  render();
}
function setPar(h, val){
  const v = Math.max(3, Math.min(6, parseInt(val)||4));
  state.par[h] = v;
  persist('par/' + h, v);
  render();
}

/* Build the whole field from the built-in tee sheet: players with their flight
   and tee time, plus the better ball pairings. Teams are only made where both
   partners are in a flight that plays the better ball, so the Ladies and
   Junior groups produce none. */
function loadTeeSheet(){
  const total = TEE_SHEET.reduce((n,g)=>n+g.p.length,0);
  if (!confirm('Load the tee sheet? This replaces the field with ' + total + ' players and clears any scores already posted.')) return;

  const players = {}, teams = {};
  TEE_SHEET.forEach(g=>{
    const ids = [];
    g.p.forEach(entry=>{
      const id = newId();
      players[id] = { name: entry[0], flight: entry[1], tee: g.t, grp: g.g, ord: ids.length, skins: true, scores: {} };
      ids.push(id);
    });
    [[0,1],[2,3]].forEach(pair=>{
      const a = ids[pair[0]], b = ids[pair[1]];
      if (!a || !b) return;
      const fa = flightOf(players[a].flight), fb = flightOf(players[b].flight);
      if (fa && fa.team && fb && fb.team) teams[newId()] = { a: a, b: b };
    });
  });

  state.players = players;
  state.teams = teams;
  persist('players', players);
  persist('teams', teams);
  bulkMsg = 'Loaded ' + total + ' players.';
  render();
}

/* Build Sunday from Saturday. Player ids are carried over deliberately: the
   two-day total is matched on id, so a fresh import with new ids would leave
   every player looking like two different people and no carryover at all.
   Partners and flights come across; scores do not. */
/* A write to Sunday's key or to the day switch is rejected until the updated
   rules are published. Firebase reports that on the promise, so say so out
   loud rather than leaving the committee thinking it worked. */
function writeOrWarn(path, value, what){
  if (!db) return;
  db.ref(path).set(value).catch(e=>{
    alert(what + " could not be saved.\n\n" + ((e && e.message) ? e.message : e) +
      "\n\nPublish the updated database rules in the Firebase console, then try again.");
  });
}

/* Apply Sunday's groups and tee times to the players already in the roster.
   Deliberately never creates or deletes anybody — a new player would get a new
   id, and the id is what ties Sunday's card to Saturday's for the two-day
   total. Anything that does not line up is reported rather than guessed at. */
function applySundayTees(){
  if (activeDay !== 'day2'){
    alert("The field is still on Saturday. Switch to Sunday first, or this would overwrite Saturday's tee times.");
    return;
  }
  const byName = {};
  playerList().forEach(x=>{ byName[canonName(x.p.name)] = x; });

  const placed = [], missing = [];
  const seen = {};
  SUNDAY_TEES.forEach(g=>{
    g.p.forEach((name, i)=>{
      const x = byName[canonName(name)];
      if (!x){ missing.push(name); return; }
      seen[x.id] = true;
      placed.push({ x: x, g: g.g, t: g.t, ord: i });
    });
  });
  const notOnSheet = playerList().filter(x=>!seen[x.id]).map(x=>x.p.name);

  let msg = 'Sunday tee sheet\n\n' + placed.length + ' of ' + playerList().length + ' players matched.';
  if (missing.length) msg += '\n\nOn the sheet but not in the roster (' + missing.length + '):\n  ' + missing.join('\n  ');
  if (notOnSheet.length) msg += '\n\nIn the roster but not on the sheet (' + notOnSheet.length + '):\n  ' + notOnSheet.join('\n  ');
  msg += '\n\nApply the groups and tee times? Scores, teams and flights are not touched.';
  if (!confirm(msg)) return;

  placed.forEach(item=>{
    const p = state.players[item.x.id];
    p.grp = item.g; p.tee = item.t; p.ord = item.ord;
    persist('players/' + item.x.id + '/grp', item.g);
    persist('players/' + item.x.id + '/tee', item.t);
    persist('players/' + item.x.id + '/ord', item.ord);
  });
  bulkMsg = 'Placed ' + placed.length + ' players in Sunday\'s groups.';
  render();
}

function buildDay2(){
  const src = days.day1, out = { eventName: src.eventName, par: src.par.slice(), players: {}, teams: {} };
  Object.keys(src.players).forEach(id=>{
    const p = src.players[id];
    out.players[id] = { name: p.name, flight: p.flight, tee: p.tee || '', grp: p.grp || 0, ord: p.ord || 0, skins: true, scores: {} };
  });
  Object.keys(src.teams).forEach(id=>{ out.teams[id] = { a: src.teams[id].a, b: src.teams[id].b }; });
  return out;
}
function startDay2(){
  const n = Object.keys(days.day1.players).length;
  if (!n){ alert('Saturday has no players to copy.'); return; }
  if (!confirm('Set Sunday up with ' + n + " players and their partners from Saturday? Saturday is not changed, and nobody moves over until you switch the field.")) return;
  const out = buildDay2();
  writeOrWarn(DAY2_PATH, out, 'Sunday');
  days.day2 = normalize(out);
  day2Exists = true;
  render();
}
function rebuildDay2(){
  if (!confirm("Rebuild Sunday from Saturday's field? Any scores already posted to Sunday are wiped.")) return;
  const out = buildDay2();
  writeOrWarn(DAY2_PATH, out, 'Sunday');
  days.day2 = normalize(out);
  day2Exists = true;
  render();
}
/* One switch moves the whole field. Held centrally on purpose — a setting on
   each phone would let one scorer post Sunday's card into Saturday. */
function switchDay(d){
  const label = DAY_LABELS[d];
  if (!confirm('Move the whole field to ' + label + "? Every phone follows, and scoring goes into " + label + "'s card.")) return;
  writeOrWarn(META_PATH + '/activeDay', d, 'The day switch');
  setActiveDay(d);
  render();
}

function fillBulk(){
  const lines = playerList().map(x=>`${x.p.name}, ${flightLabel(x.p.flight)}`);
  document.getElementById('bulkbox').value = lines.join('\n');
}
function applyBulk(){
  const raw = document.getElementById('bulkbox').value;
  const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  if (!lines.length){ bulkMsg='Nothing to apply.'; render(); return; }
  if (!confirm('Replace the whole field with these ' + lines.length + ' player(s)? Scores and teams are cleared.')) return;

  const players = {};
  lines.forEach(line=>{
    const parts = line.split(',').map(s=>s.trim());
    const name = parts[0] || '';
    const want = (parts[1] || '').toLowerCase();
    let flight = 'championship';
    FLIGHTS.forEach(f=>{ if (f.id===want || f.label.toLowerCase()===want) flight = f.id; });
    players[newId()] = { name, flight, scores:{} };
  });
  state.players = players;
  state.teams = {};
  persist('players', players);
  persist('teams', null);
  bulkMsg = 'Loaded ' + lines.length + ' player(s).';
  render();
}

function clearScores(){
  if (!confirm('Clear every hole score for the whole field?')) return;
  Object.keys(state.players).forEach(id=>{
    state.players[id].scores = {};
    persist('players/' + id + '/scores', null);
  });
  render();
}
function clearTeams(){
  if (!confirm('Remove every team? The roster and scores are kept.')) return;
  state.teams = {};
  persist('teams', null);
  render();
}
function clearAll(){
  if (!confirm('Full reset — wipe players, teams and scores?')) return;
  state = defaultState();
  if (!localMode && db) db.ref(DAY_KEYS[activeDay]).set(state); else persist('', null);
  render();
}

/* Hide the whole sponsor bar until the logo files exist, rather than leaving an
   empty white strip under the header. */
function spCheck(){
  const bar = document.querySelector('.sponsors');
  if (!bar) return;
  const shown = Array.prototype.filter.call(bar.querySelectorAll('.sp'), el=>el.style.display!=='none');
  bar.style.display = shown.length ? '' : 'none';
}

function renderPreservingFocus(){
  const a = document.activeElement;
  const id = a && a.id ? a.id : null;
  const val = id ? a.value : null;
  const selStart = (id && a.selectionStart!==undefined) ? a.selectionStart : null;
  render();
  if (id){
    const el = document.getElementById(id);
    if (el){
      el.focus();
      if (el.tagName==='INPUT' && val!==null && el.value!==val) el.value = val;
      try{ if (selStart!==null) el.setSelectionRange(selStart, selStart); }catch(e){}
    }
  }
}

render();
</script>
